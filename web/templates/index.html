<html>
<head>
    <title>Sample app</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>Register Router</h1>
    <a href="{{ url_for('interface_status') }}">View interface status</a>
    <form method="POST" action="/add">
    IP: <input name="ip" placeholder="IP" required />
    Username: <input name="username" placeholder="Username" required />
    Password: <input name="password" placeholder="Password" required />
    <button type="submit">Add</button>
  </form>

  <ul>
  {% for comment in data %}
    <li>
      {{ comment.ip }} - {{ comment.username }} - {{ comment.password }}
      <a href="{{ url_for('interface_status', router=comment.ip) }}">Interface status</a>

      <form
        method="POST"
        action="{{ url_for('delete_comment', document_id=comment['_id']|string) }}"
        style="display:inline"
      >
        <button type="submit">Delete</button>
      </form>
    </li>
  {% endfor %}
</ul>

</body>
</html>
